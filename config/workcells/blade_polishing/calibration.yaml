# Workcell calibration target for Nero blade polishing.
#
# The link5 Gemini335L camera mount is described by URDF/Xacro in
# `urdf/sensors/link5_gemini335l_mount.xacro`. The old
# `gripper_flange -> grinder_camera_optical_frame` calibration is no longer a
# stable interface for this branch.

target_mount_to_target:
  x: 0.45
  y: 0.0
  z: 0.15
  qx: 0.0
  qy: 0.0
  qz: 0.0
  qw: 1.0
